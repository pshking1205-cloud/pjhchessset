<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>체스 컬렉션</title>

<style>
/* 레이아웃: 상단 고정 내비 + 로비(플레이 설정) / 대국 화면(보드·플레이어 바 | 기보·정보 사이드 패널). 체스 사이트식 다크 우선 */
:root{
 --bg:#2b2926;--nav:#211f1c;--card:#363330;--card2:#45413c;--fg:#f0ece6;--mut:#a59f96;--bd:#4b4641;
 --ac:#81b64c;--acd:#5b8a2c;--acf:#ffffff;--gold:#e8b13a;--warn:#e5574a;
 --lt:#ebecd0;--dk:#739552;--hl:rgba(255,255,51,.45);
 --f-disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
 --f-body:"IBM Plex Sans KR","Noto Sans KR",system-ui,-apple-system,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --navh:54px;color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efede8;--nav:#ffffff;--card:#ffffff;--card2:#f0eee8;--fg:#262421;--mut:#6c675f;--bd:#dcd8cf;--ac:#6fa23c;--acd:#4e7a24;--gold:#c48a10;--warn:#c9392c;color-scheme:light}}
:root[data-theme="light"]{--bg:#efede8;--nav:#ffffff;--card:#ffffff;--card2:#f0eee8;--fg:#262421;--mut:#6c675f;--bd:#dcd8cf;--ac:#6fa23c;--acd:#4e7a24;--gold:#c48a10;--warn:#c9392c;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:46;background:var(--nav)}
button{font:inherit;font-weight:700;padding:9px 14px;border-radius:8px;border:0;background:var(--ac);color:var(--acf);cursor:pointer;box-shadow:0 3px 0 var(--acd);transition:filter .12s,transform .06s}
button:hover:not(:disabled){filter:brightness(1.08)}button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--acd)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.g{background:var(--card2);color:var(--fg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:disabled{opacity:.35;cursor:default}
small{color:var(--mut)}

/* 내비 */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:45;height:var(--navh);background:var(--nav);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;background:none;box-shadow:none;color:var(--fg);padding:4px 6px 4px 0;font-family:var(--f-disp);font-size:20px;font-weight:400;letter-spacing:.5px}

.nlink{background:none;box-shadow:none;color:var(--mut);padding:8px 10px;font-weight:500}
.nlink:hover{color:var(--fg)}.nlink:active:not(:disabled){box-shadow:none}
.sp{flex:1}
#acb{display:flex;gap:6px;align-items:center;min-width:0}

#gear{width:36px;height:36px;padding:0;font-size:18px;background:var(--card2);color:var(--fg);box-shadow:none;flex:0 0 auto}

@media(max-width:560px){.nlink{display:none}}@media(max-width:420px){.logo span{display:none}}

/* 대국 화면 */
.app{max-width:1180px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

.av{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;background:var(--card2)}
.av.w{background:#d8d4cc}.av.b{background:#2f2c29}.av .pc{width:30px;height:30px}
.pn{min-width:0;flex:1}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{font-weight:400;margin-left:6px}

.cap .pc{width:17px;height:17px;margin-right:-5px}
.cap b{margin-left:9px;font-size:12px;color:var(--mut);font-weight:500}
.lv{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--gold);color:#2b2926;font-size:11px;font-weight:700;vertical-align:1px}

.pbar.act .av{box-shadow:0 0 0 2px var(--ac)}

#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;max-width:100%;aspect-ratio:1/1;border-radius:4px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);container-type:inline-size}
.q{display:flex;align-items:center;justify-content:center;font-size:9cqw;line-height:1;position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-width:0;min-height:0;overflow:hidden}
.l{background:var(--lt)}.d{background:var(--dk)}
.lm{background-image:linear-gradient(var(--hl),var(--hl))}
.s{background-image:linear-gradient(rgba(255,255,51,.6),rgba(255,255,51,.6))}
.ck{background-image:radial-gradient(circle,rgba(229,57,53,.95),rgba(229,57,53,0) 75%);animation:ckpulse 1s infinite}
.atk{box-shadow:inset 0 0 0 3px rgba(229,57,53,.85)}
@keyframes ckpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.m2::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.16);position:absolute}
.m2.x::after{width:92%;height:92%;background:none;border:6cqw solid transparent;border-width:.9cqw;box-shadow:inset 0 0 0 1cqw rgba(0,0,0,.18);border-radius:50%}
.q:hover.m2::after{background:rgba(0,0,0,.26)}
.bdg{position:absolute;left:2px;bottom:1px;font-size:11px;line-height:1;font-style:normal;pointer-events:none}.fzn{box-shadow:inset 0 0 0 3px rgba(80,170,255,.85)}
.co{position:absolute;font-size:max(9px,1.6cqw);line-height:1;font-weight:700;font-style:normal;font-family:var(--f-body)}.cf{right:3px;bottom:2px}.cr{left:3px;top:3px}
.l .co{color:var(--dk)}.d .co{color:var(--lt)}
.o2{display:inline-block;transform:rotate(180deg)}
.pc{display:block;width:1.25em;height:1.25em}.pw .pc{filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}.pb .pc{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border-radius:10px;overflow:hidden;min-width:0}
.ph{padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--mut);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between}
#top{padding:14px}
#st{font-weight:700;font-size:15px;line-height:1.4}
#st #ms{font-weight:400;font-size:13px;color:var(--mut);margin-top:4px;min-height:17px}
#tmr,#tmr2{font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
#hs{max-height:250px;overflow:auto;font-family:var(--f-mono);font-size:13px}
.mr{display:grid;grid-template-columns:44px 1fr 1fr;padding:5px 14px}.mr:nth-child(odd){background:rgba(127,127,127,.07)}
.mr i{font-style:normal;color:var(--mut)}.mr span{justify-self:start;padding:0 6px;border-radius:3px;min-width:0;overflow-wrap:anywhere}.mr span.cur{background:var(--card2);font-weight:700}
#hs>div:not(.mr){padding:4px 14px}

.ag2{cursor:pointer;display:inline-block;padding:2px 8px;margin:2px;border:1px solid var(--bd);border-radius:999px;background:var(--card2)}.ag2.u{opacity:.5}
/* 증강 칩 등급 색: COMMON 회색 · RARE 파랑 · EPIC 자주 · LEGEND 금 · LUNACY 장미 */
.ag2 .rkt{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;padding:0 5px;margin-right:4px;border-radius:999px;color:#fff;vertical-align:1px}
.ag2.rk-COMMON{border-color:#8a8f99}.ag2.rk-COMMON .rkt{background:#7d828c}
.ag2.rk-RARE{border-color:#3b8ee6;background:color-mix(in srgb,#3b8ee6 16%,var(--card2))}.ag2.rk-RARE .rkt{background:#2f7fd8}
.ag2.rk-EPIC{border-color:#a24fd6;background:color-mix(in srgb,#a24fd6 16%,var(--card2))}.ag2.rk-EPIC .rkt{background:#9440c8}
.ag2.rk-LEGEND{border-color:#d9a520;background:color-mix(in srgb,#e8b13a 20%,var(--card2))}.ag2.rk-LEGEND .rkt{background:linear-gradient(90deg,#c88a0c,#f0c544);color:#3a2400}
.ag2.rk-LUNACY{border-color:#e0457f;background:color-mix(in srgb,#e0457f 18%,var(--card2));box-shadow:0 0 8px rgba(255,90,140,.45)}.ag2.rk-LUNACY .rkt{background:linear-gradient(90deg,#9c0c3e,#f2558f);font-family:Cinzel,Georgia,serif}
.ag2.rkl{cursor:default;font-size:10px;padding:0 6px 0 2px;letter-spacing:.5px}
/* ACTIVE·PASSIVE도 등급 글자(영문 대문자)와 같은 모양으로 */
.dct,.aty{text-transform:uppercase}
/* 좁은 화면: 「등급 · PASSIVE · OPENING」이 길면 줄바꿈해서 카드가 화면 밖으로 밀리지 않게 */
#drb .dc{min-width:0}
@media(max-width:600px){#drb .dct,#cv .dct{white-space:normal!important;line-height:1.35;max-width:100%;text-align:center;border-radius:8px}}.aty{font-weight:700;letter-spacing:.8px;font-size:11px}
.adc{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--card2)}
#inf button{margin:6px 4px 0 0;padding:6px 10px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}

#top2{transform:rotate(180deg);background:var(--card);border-radius:10px;padding:10px 12px}
#top2 button{margin:6px 4px 0 0}

/* 오버레이 공통 */
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:20px}
.ov.on{display:flex}
.pop{background:var(--card);color:var(--fg);border-radius:14px;padding:20px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.pop h2,.pop h3{margin:2px 0 14px;font-family:var(--f-disp);font-weight:400;letter-spacing:.3px}
.pop h2{font-size:26px}.pop h3{font-size:20px}
#pm{display:flex;justify-content:center;gap:8px;margin-top:12px}
#pm button{padding:8px;background:var(--card2);box-shadow:none}#pm .pc{width:44px;height:44px}
/* 증강 선택: 금속 테두리 카드 3장 (등급 색: COMMON 회색 · RARE 파랑 · EPIC 자주 · LEGEND 노랑) */
#dro{background:radial-gradient(ellipse at 50% 40%,rgba(40,34,60,.82),rgba(6,6,12,.92));backdrop-filter:blur(3px);overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#dro .pop{max-width:780px;background:none;box-shadow:none;padding:0;margin:auto}
.dcd{overflow-wrap:anywhere}
#drt{color:#f3effa;font-size:18px;margin-bottom:18px!important;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#drb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.dc{--c1:#e4e6ec;--c2:#80858f;--c3:#b9bdc6;--gl:rgba(205,210,222,.32);display:flex;margin:0;padding:5px;border-radius:16px;color:#f3effa;font-weight:500;text-align:center;
 background:linear-gradient(155deg,var(--c1),var(--c2) 38%,var(--c3) 55%,var(--c2) 75%,var(--c1));
 box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 0 22px var(--gl),0 14px 30px rgba(0,0,0,.5);
 animation:dcin .45s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i)*90ms);transition:transform .15s,box-shadow .15s}
.dc:hover:not(:disabled){filter:none;transform:translateY(-6px);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 34px var(--gl),0 20px 36px rgba(0,0,0,.55)}
.dc:active:not(:disabled){transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 34px var(--gl)}
.dc.rc-RARE{--c1:#bfe3ff;--c2:#2b72c9;--c3:#64aef5;--gl:rgba(70,150,255,.5)}
.dc.rc-EPIC{--c1:#efc2ff;--c2:#8530bd;--c3:#c272ee;--gl:rgba(190,80,255,.55)}
.dc.rc-LEGEND{--c1:#fff3b0;--c2:#b8860f;--c3:#f3cb4a;--gl:rgba(255,196,50,.6)}
.dcf{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:290px;padding:22px 14px 18px;border-radius:12px;
 background:radial-gradient(ellipse at 50% 0,var(--gl),transparent 55%),linear-gradient(180deg,#262331,#131219);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.dci{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px;
 background:radial-gradient(circle at 50% 35%,#3b3650,#17151f 70%);box-shadow:0 0 0 2px var(--c3),0 0 0 6px rgba(0,0,0,.45),0 0 26px var(--gl)}
.dci svg{width:40px;height:40px;fill:var(--c1);filter:drop-shadow(0 0 6px var(--gl))}
.dcn{font-size:17px;font-weight:700;line-height:1.3;color:#fff;text-wrap:balance}
.dct{font-size:11px;font-weight:700;letter-spacing:.8px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.4);color:var(--c1);box-shadow:inset 0 0 0 1px var(--c2)}
.dcd{font-size:13px;line-height:1.55;color:#cdc8da;margin-top:4px}
@keyframes dcin{from{opacity:0;transform:translateY(24px) scale(.94)}}
@media(max-width:600px){#drb{gap:8px}.dc{padding:3px;border-radius:12px}#drt{font-size:16px;margin-bottom:12px!important}.dcf{min-height:200px;padding:12px 6px 10px;gap:5px;border-radius:10px}.dci{width:44px;height:44px;margin-bottom:2px}.dci svg{width:24px;height:24px}.dcn{font-size:14px}.dct{font-size:9px;padding:2px 6px;letter-spacing:0;white-space:nowrap}.dcd{font-size:11.5px;line-height:1.45}}
#rso .pop{padding:0;overflow:hidden}

#rso .rb button{margin:0}#rso #rn{grid-column:1/-1}
#cv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:35}#cv.show{opacity:1}
.cc{width:150px;height:210px;border-radius:16px;border:6px solid #fff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);text-align:center;padding:8px;animation:pop .35s}
.cc b{font-size:62px;line-height:1}.cc span{font-size:15px;font-weight:700}@keyframes pop{from{transform:scale(.5) rotate(-12deg)}}
.pop input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:100%;margin:4px 0}

#pv>div{display:grid;place-items:center;font-size:9cqw;min-width:0;min-height:0;overflow:hidden}
@media(max-width:899px){#pv{display:none}.hero h1{font-size:34px}}
.play{background:var(--card);border-radius:14px;padding:20px;min-width:0}
.play h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;margin:0;text-align:left;background:var(--card2);color:var(--fg);box-shadow:none;padding:12px 14px;border:2px solid transparent;font-weight:500}
.opt .oi{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-size:18px;flex:0 0 auto}
.opt .ot{min-width:0;flex:1}.opt .ot b{display:block;font-size:15px}.opt .ot small{display:block;font-size:12px;line-height:1.45;margin-top:2px}
.opt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card2))}
.opt:active:not(:disabled){transform:none}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;margin:0;box-shadow:none;background:transparent;color:var(--mut);padding:9px 6px}
.seg button.on{background:var(--ac);color:var(--acf);box-shadow:0 2px 0 var(--acd)}
.seg button.on::before{content:"✓ "}
.seg.sl{overflow-x:auto;scrollbar-width:none}.seg.sl::-webkit-scrollbar{display:none}.seg.sl button{flex:0 0 auto;min-width:110px;white-space:nowrap}
#go{width:100%;margin-top:20px;padding:15px;font-size:18px;box-shadow:0 5px 0 var(--acd)}
.ntc{background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:500;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}

/* 관리자 탭 (지정한 계정만) */
.adml{display:inline-flex;align-items:center;gap:6px}.adml svg{width:16px;height:16px;flex:0 0 auto}
@media(max-width:560px){.nlink.adml{display:inline-flex;padding:8px 6px}.adml span{display:none}}
#adm{z-index:41;top:calc(var(--navh) + env(safe-area-inset-top,0px));background:var(--bg);overflow:auto;padding:0}#adm.on{display:block}
.adw{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.adh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.adh h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:34px}.adh p{margin:4px 0 0;color:var(--mut)}.adh button{margin:0}
#admT{background:var(--nav);overflow-x:auto;scrollbar-width:none}#admT::-webkit-scrollbar{display:none}#admT button{flex:1 0 auto;white-space:nowrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kp{background:var(--card);border-radius:10px;padding:16px}.kp>i{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--mut)}.kp>b{display:flex;align-items:center;font-family:var(--f-mono);font-size:30px;font-weight:500;margin:6px 0 2px}.kp>small{font-size:12px}
.adr{display:flex;flex-wrap:wrap;gap:12px}.adr>.panel{flex:1 1 380px}
.abar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;padding:8px 16px}.abar>span:nth-child(2){height:14px;border-radius:4px;background:var(--card2);overflow:hidden}.abar>span>i{display:block;height:100%;background:var(--ac)}.abar>b{font-family:var(--f-mono);font-weight:500;text-align:right}
.ad .tb td,.ad .tb th{padding:9px 12px}.adx{overflow-x:auto}.adx .tb{min-width:640px}
.ad .tb button{margin:0;padding:6px 10px;font-size:12px;box-shadow:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6c675f;margin-right:6px;flex:0 0 auto}.dot.on{background:var(--ac)}
.bdg2{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--warn);color:#fff;font-size:10px;font-weight:700}
.stale{color:var(--gold)}
.awt{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:12px;padding:6px 16px}.awt input[type=range]{width:100%;accent-color:var(--ac)}.awt input[type=number]{font:inherit;width:70px;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}.awt .ag2{margin:0;cursor:default;text-align:center;font-size:11px}
.agl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.agl label{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer;min-width:0}.agl input{width:18px;height:18px;accent-color:var(--ac);flex:0 0 auto}.agl label>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agl label.off>span{text-decoration:line-through;color:var(--mut)}.agl .ag2{margin:0;padding:0 2px;cursor:inherit}.agl .rkt{margin:0}
#admN{width:100%;min-height:90px;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);resize:vertical}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ 2) 공통 엔진 (UI/모드 무관) ============ */
const Engine=(()=>{
 const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8,opp=c=>c==="w"?"b":"w";
 const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],DG=[[1,1],[1,-1],[-1,1],[-1,-1]],OR=[[1,0],[-1,0],[0,1],[0,-1]],AL=[...DG,...OR];
 function initial(){
  const b=Array(64).fill(null),o="RNBQKBNR";
  for(let c=0;c<8;c++)[[0,o[c],"b",1],[1,"P","b",1],[6,"P","w",-1],[7,o[c],"w",-1]].forEach(([r,t,k,f])=>{b[r*8+c]={t,c:k,f,m:false,h:r*8+c}});
  return{b,turn:"w",ep:null,hm:0,last:null,over:null,log:[],reps:{},seat:{w:0,b:1},dead:{w:[],b:[]},phase:"move",left:1,skip:[0,0],msg:"",shown:null,promoList:["Q","R","B","N"]};
 }
 let XM=null; // 모드가 이동 규칙을 확장할 때 쓰는 훅(없으면 영향 없음)
 function attacked(b,sq,by){
  const r=sq>>3,c=sq&7;
  for(const f of[1,-1])for(const dx of[-1,1]){const y=r-f,x=c+dx;if(inb(y,x)){const p=b[y*8+x];if(p&&p.t==="P"&&p.c===by&&p.f===f)return true}}
  for(const[a,d]of KN){const y=r+a,x=c+d;if(inb(y,x)){const p=b[y*8+x];if(p&&p.c===by&&p.t==="N")return true}}
  for(const[a,d]of AL){const y=r+a,x=c+d;if(inb(y,x)){const p=b[y*8+x];if(p&&p.c===by&&p.t==="K")return true}}
  for(const[a,d]of AL){let y=r+a,x=c+d;while(inb(y,x)){const p=b[y*8+x];if(p){if(p.c===by&&(p.t==="Q"||(p.t==="R"&&(a===0||d===0))||(p.t==="B"&&a!==0&&d!==0)))return true;break}y+=a;x+=d}}
  return false;
 }
 function inCheck(b,k){const ki=b.findIndex(p=>p&&p.t==="K"&&p.c===k);return ki>=0&&attacked(b,ki,opp(k))}
 function pseudo(s,i){
  const b=s.b,p=b[i],r=i>>3,c=i&7,out=[];
  const push=(y,x)=>{const q=b[y*8+x];if(q&&q.c===p.c)return false;out.push({from:i,to:y*8+x});return !q};
  const slide=ds=>ds.forEach(([a,d])=>{let y=r+a,x=c+d;while(inb(y,x)&&push(y,x)){y+=a;x+=d}});
  if(p.t==="R")slide(OR);else if(p.t==="B")slide(DG);else if(p.t==="Q")slide(AL);
  else if(p.t==="N")KN.forEach(([a,d])=>{if(inb(r+a,c+d))push(r+a,c+d)});
  else if(p.t==="K"){
   AL.forEach(([a,d])=>{if(inb(r+a,c+d))push(r+a,c+d)});
   if(!p.m)[0,7].forEach(x=>{ // 캐슬링: 킹/룩 미이동, 사이 빈칸, 킹 통과칸 비공격
    const R=b[r*8+x];if(!R||R.t!=="R"||R.c!==p.c||R.m)return;const d=x>c?1:-1;
    for(let k=c+d;k!==x;k+=d)if(b[r*8+k])return;
    if(c+2*d<0||c+2*d>7)return;
    if(attacked(b,i,opp(p.c))||attacked(b,r*8+c+d,opp(p.c)))return;
    out.push({from:i,to:r*8+c+2*d,castle:{rf:r*8+x,rt:r*8+c+d}});
   });
  }else{
   const f=p.f,last=r+f===(f<0?0:7),add=(y,x,e)=>{if(last)s.promoList.forEach(t=>out.push({from:i,to:y*8+x,promo:t,...e}));else out.push({from:i,to:y*8+x,...e})};
   if(inb(r+f,c)&&!b[(r+f)*8+c]){add(r+f,c);if(!p.m&&inb(r+2*f,c)&&!b[(r+2*f)*8+c])out.push({from:i,to:(r+2*f)*8+c})}
   [-1,1].forEach(dx=>{const y=r+f,x=c+dx;if(!inb(y,x))return;const q=b[y*8+x];
    if(q&&q.c!==p.c)add(y,x);else if(!q&&s.ep&&s.ep.sq===y*8+x&&s.ep.by!==p.c)add(y,x,{ep:true})});
  }
  return XM?XM(s,i,p,out,{push,slide}):out;
 }
 function apply(s,mv){ // 기물 이동만 수행. 턴 전환은 모드가 결정
  const b=s.b.slice(),p=b[mv.from];let cap=b[mv.to];
  if(mv.ep){cap=b[s.ep.pawn];b[s.ep.pawn]=null}
  b[mv.from]=null;b[mv.to]={...p,m:true,t:mv.promo||p.t};
  if(mv.castle){b[mv.castle.rt]={...b[mv.castle.rf],m:true};b[mv.castle.rf]=null}
  const dbl=p.t==="P"&&Math.abs(mv.to-mv.from)===16;
  return{...s,b,cap,ep:dbl?{sq:(mv.from+mv.to)/2,pawn:mv.to,by:p.c}:null,hm:(p.t==="P"||cap)?0:s.hm+1,last:[mv.from,mv.to]};
 }
 function legal(s,i,kc){const p=s.b[i];if(s.free)return pseudo(s,i);return pseudo(s,i).filter(m=>{const q=s.b[m.to];if(kc&&q&&q.t==="K")return true;return !inCheck(apply(s,m).b,p.c)})}
 function all(s,kc){const o=[];for(let i=0;i<64;i++){const p=s.b[i];if(p&&p.c===s.turn)o.push(...legal(s,i,kc))}return o}
 function insufficient(b){
  const ps=b.filter(p=>p&&p.t!=="K");if(!ps.length)return true;
  if(ps.some(p=>p.t==="P"||p.t==="R"||p.t==="Q"))return false;if(ps.length===1)return true;
  if(ps.every(p=>p.t==="B")){const sq=b.map((p,i)=>p&&p.t==="B"?((i>>3)+(i&7))%2:-1).filter(x=>x>=0);return sq.every(x=>x===sq[0])}
  return false;
 }
 const key=s=>s.b.map(p=>p?p.c+p.t+((p.t==="K"||p.t==="R")&&p.m?"m":""):".").join("")+s.turn+(s.ep?s.ep.sq:"");
 return{initial,pseudo,legal,all,apply,inCheck,attacked,insufficient,key,opp,inb,setX:f=>{XM=f}};
})();

  const t=Engine.apply(s,mv),me=s.turn,you=opp(me),p=s.b[mv.from],cap=t.cap,n={...t,turn:you};
  const ls=Engine.all(n),ck=Engine.inCheck(n.b,you);

  san+=ck?(ls.length?"+":"#"):"";
  n.log=[...s.log,san];n.reps={...s.reps};const k=Engine.key(n);n.reps[k]=(n.reps[k]||0)+1;
  n.msg=(you==="w"?"백":"흑")+" 차례"+(ck&&ls.length?" · 체크!":"");
  if(!ls.length)n.over=ck?{win:me,why:"체크메이트"}:{win:null,why:"스테일메이트"};
  else if(Engine.insufficient(n.b))n.over={win:null,why:"기물 부족"};

  else if(n.reps[k]>=3)n.over={win:null,why:"3회 반복"};
  if(n.over)n.msg=n.over.why;
  return n;
 },

 advance:{n:"부정출발",o:1,p:1,r:"COMMON",d:"모든 아군 기물이 2칸 전진된 상태로 시작합니다."},
 london:{n:"런던 시스템",o:1,p:1,r:"COMMON",d:"런던 시스템의 첫 7수(d4·e3·c3·Bf4·Nf3·Nbd2·Bd3)가 진행된 상태로 내 진영을 배치합니다."},
 rocket:{n:"로켓",o:1,p:1,r:"RARE",d:"아군 룩이 각각 첫 이동에 한해 아마존(퀸+나이트)처럼 행마할 수 있습니다."},
 hill:{n:"언덕의 왕",o:1,p:1,r:"COMMON",d:"킹이 보드 중앙 4칸으로 들어올 경우 아마존(퀸+나이트)처럼 움직일 수 있습니다."},
 vanguard:{n:"선봉",o:1,p:1,r:"COMMON",d:"제일 선두에 있는 아군 폰이 하나라면, 해당 폰은 대각선으로도 이동할 수 있습니다. (확인 필요: 앞쪽 빈 대각선으로 해석)"},
 martyr:{n:"순교",o:1,p:1,r:"COMMON",d:"비숍을 전부 희생하여 모든 아군 폰에 가호를 부여합니다."},
 notice:{n:"예고장",o:1,p:1,r:"COMMON",d:"상대 무작위 비폰 기물(킹 제외) 하나에 예고장(✉)을 보냅니다. 해당 기물이 잡힐 경우, 같은 편의 다른 기물 하나를 추가로 제거합니다."},
 geneva:{n:"제네바 협약",o:1,p:1,r:"COMMON",d:"상대방 퀸이 아군 폰을 잡을 수 없습니다."},
 zonber:{n:"존버",o:1,p:1,r:"COMMON",d:"무작위 아군 폰 하나가 28수 뒤 퀸으로 승진합니다. (확인 필요: 내 이동 28번 기준, 고르기 대신 무작위)"},
 dash:{n:"질주",o:1,p:1,r:"COMMON",d:"폰이 첫 번째 이동으로 세 칸까지 갈 수 있습니다."},
 d4:{n:"d4",o:1,p:1,r:"COMMON",d:"상대 기물과 아군 킹이 d4에 도착할 수 없습니다. 흑일 경우 d5."},
 ban:{n:"선공권",o:1,p:1,r:"RARE",d:"상대방이 첫 8수 동안 기물을 잡을 수 없게 됩니다. 단, 기물이 잡히거나 체크 시 제한이 해제됩니다."},
 hasty:{n:"성급한 승진",o:1,p:1,r:"RARE",d:"아군 폰의 프로모션 랭크가 3칸 내려옵니다. 단, 메이저 피스로는 변할 수 없습니다."},
 early:{n:"조기 진급",o:1,p:1,r:"RARE",d:"아군 폰의 프로모션 랭크가 2칸 내려옵니다."},
 special:{n:"특진",o:1,p:1,r:"RARE",d:"아군 폰이 기물을 2개 잡으면 즉시 프로모션(퀸)합니다."},
 locust:{n:"메뚜기떼",o:1,p:1,r:"EPIC",d:"아군 마이너 피스와 룩이 시작 위치에서 움직이지 않았다면 그래스호퍼(기물 하나를 뛰어넘어 바로 뒤 칸에 착지)처럼 한 번 이동할 수 있습니다."},
 iqp:{n:"IQP",o:1,p:1,r:"EPIC",d:"상대 e폰과 c폰을 제거합니다."},
 exped:{n:"친정",o:1,p:1,r:"EPIC",d:"아군 킹이 상대방 폰을 잡을 경우 한 번 더 움직일 수 있습니다."},
 corner:{n:"코너킥",p:1,r:"COMMON",d:"아군 나이트가 보드의 구석 2x2 자리에 위치할 경우 비숍처럼도 움직일 수 있습니다."},
 vortex:{n:"소용돌이",r:"COMMON",d:"사용: 킹과 폰을 제외한 모든 적 기물의 위치를 서로 뒤섞습니다."},
 swapk:{n:"바꿔치기",r:"COMMON",d:"사용: 이번 턴 동안 킹이 턴을 소모하여 아군 폰과 위치를 바꿀 수 있습니다."},
 rotate:{n:"교대",r:"COMMON",d:"사용: 이번 턴 동안 아군 기물이 턴을 소모하여 같은 행 또는 열의 아군과 위치를 바꿀 수 있습니다."},
 exhaust:{n:"탈진",p:1,r:"COMMON",d:"상대는 같은 기물을 4번 연속 움직일 수 없습니다. 킹은 예외입니다."},
 whitebox:{n:"하얀 상자",p:1,r:"COMMON",d:"획득 시 무작위 패시브 증강 카드 하나를 발동합니다."},
 potion:{n:"수상한 물약",r:"COMMON",d:"사용: 아군 혹은 적 기물 하나에 무작위 효과(가호·독·빙결·기절)를 부여합니다. (고르기 대신 무작위)"},
 promoexp:{n:"승진 체험",r:"COMMON",d:"사용: 무작위 아군 비폰 기물 하나가 이번 턴에 퀸처럼도 이동할 수 있지만 기물을 잡을 수 없습니다."},
 cut:{n:"절단",r:"COMMON",d:"사용: 무작위 상대 원거리 기물 하나가 다음 2수 동안 한 칸씩만 이동할 수 있습니다."},
 loyal:{n:"충신",r:"COMMON",d:"사용: 무작위 아군 기물(킹 제외) 하나가 위치와 관계없이 턴을 소모해 킹 주변 빈 칸으로 이동할 수 있습니다(계속 유지)."},
 ghillie:{n:"길리 슈트",r:"COMMON",d:"사용: 3수 동안 비숍이 기물을 뛰어넘어 이동할 수 있지만, 뛰어넘으며 동시에 기물을 잡을 순 없습니다."},
 combo:{n:"환상의 콤비",r:"COMMON",d:"사용: 무작위 아군 기물 둘(킹 제외)을 연결합니다. 둘 중 하나가 이동할 때마다 서로 위치를 변경합니다."},
 dice:{n:"주사위",r:"COMMON",d:"사용: 주사위를 굴려 나온 눈(1 폰, 2 나이트, 3 비숍, 4 룩, 5 퀸, 6 킹)에 해당하는 상대 기물을 2턴간 봉인합니다."},
 wang:{n:"왕명",r:"RARE",d:"사용: 다음 자기 턴부터 2수 동안 모든 아군 기물이 킹처럼 이동할 수 있습니다."},
 truce:{n:"휴전",r:"RARE",d:"사용: 아군 및 적군 기물이 다음 2수 동안 서로 잡을 수 없습니다."},
 inertia:{n:"관성",r:"RARE",d:"사용: 무작위 상대 원거리 기물 하나는 이제 한 칸씩 움직일 수 없습니다."},
 mad:{n:"광마",p:1,r:"RARE",d:"나이트가 아군 기물을 잡을 수 있습니다. 아군을 잡으면 나이트가 한 번 더 움직입니다."},
 greek:{n:"그릭 기프트",r:"RARE",d:"사용: 무작위 아군 비숍 하나를 희생합니다. 이번 턴 종료 시 상대 킹 주변 8칸에 있는 상대 폰을 모두 제거합니다."},
 miracle:{n:"기적",r:"RARE",d:"사용: 무작위 아군 비숍 하나가 현재 잡을 수 있는 기물(킹 제외)을 모두 전향시킵니다. 이후 해당 비숍은 희생됩니다."},
 basics:{n:"기초 교습",r:"RARE",d:"사용: 무작위 아군 기물 하나에 폰의 행마법을 추가로 부여합니다."},
 mirror:{n:"대칭",r:"RARE",d:"사용: 이번 턴 동안 아군 기물이 턴을 소모하여 좌우대칭 칸(빈 칸)으로 이동할 수 있습니다."},
 liftrook:{n:"룩 리프트",p:1,r:"RARE",d:"룩이 체스판 맨 구석 4칸에 도착하면 한 번 더 이동할 수 있습니다."},
 oops:{n:"실수",r:"RARE",d:"사용: 이번 턴에 상대방이 기물을 잡을 경우 50% 확률로 실수합니다. 실수하면 반대로 상대의 기물이 잡힙니다."},
 kinship:{n:"연대",r:"RARE",d:"사용: 이번 턴 동안 아군 마이너 피스가 턴을 소모해 서로 위치를 변경할 수 있습니다."},
 ironwall:{n:"철벽",p:1,r:"RARE",d:"아군 진영에 있는 내 룩이 가로세로로 잡히지 않습니다."},
 religion:{n:"종교 승리",p:1,r:"RARE",d:"비숍이 상대방보다 3개 더 많으면 즉시 승리합니다."},
 brk:{n:"돌파",r:"EPIC",d:"사용: 이번 턴 동안 아군 폰이 바로 앞의 적 기물을 잡으며 이동할 수 있습니다."},
 enpass:{n:"앙파상",r:"EPIC",d:"사용: 이번 턴 동안 아군 폰이 옆에 있는 모든 기물을 상대로 앙파상할 수 있습니다."},
 majesty:{n:"위엄",p:1,r:"EPIC",d:"적군 메이저 피스(퀸·룩)가 아군 킹 주변 8칸으로 올 수 없습니다."},
 disarm:{n:"무장해제",r:"EPIC",d:"사용: 무작위 상대 기물(킹 제외) 하나는 다음 상대 턴에 기물을 잡을 수 없습니다."},
 overwhelm:{n:"압도",p:1,r:"EPIC",d:"상대 킹은 아군 퀸을 잡을 수 없습니다."},
 social:{n:"사회주의",r:"EPIC",d:"사용: 다음 턴에 킹을 제외한 상대의 모든 기물은 원래 행마를 잃고 폰처럼 움직입니다."},
 sniper:{n:"저격",r:"EPIC",d:"사용: 이번 턴 동안 비숍이 진영에 상관없이 폰 하나를 뛰어넘어 공격할 수 있습니다."},
 sovereign:{n:"제왕학",p:1,r:"EPIC",d:"아군 킹이 기물을 잡을 경우 잡은 기물의 행마법을 습득합니다. 습득한 행마법은 중첩됩니다."},
 overtake:{n:"추월",r:"EPIC",d:"사용: 이번 턴에 룩이 아군 기물을 뛰어넘으며 이동할 수 있습니다."},
 killer:{n:"킬러 킹",p:1,r:"EPIC",d:"아군 킹이 상대방 킹을 잡을 땐 룩처럼도 움직일 수 있습니다."},
 e4:{n:"e4",r:"EPIC",d:"사용: 이번 턴 동안 아군 기물이 턴을 소모하여 e4(빈 칸)로 이동할 수 있습니다. 흑일 경우 e5."},
 rampage:{n:"난폭한 돌진",p:1,r:"EPIC",d:"아군 나이트가 상하좌우의 적 기물을 뛰어넘으면 그 기물을 자동으로 잡습니다."},
 chain:{n:"사슬",r:"COMMON",d:"사용: 서로 2칸 안에 있는 무작위 상대 기물 둘을 지정합니다. 두 기물이 모두 살아 있을 경우 서로 2칸보다 멀어질 수 없습니다."},
 swapx:{n:"치환",r:"COMMON",d:"사용: 이번 턴 동안 아군 기물이 턴을 소모하여 같은 종류의 상대 말과 위치를 바꿀 수 있습니다."},
 sync:{n:"동기화",p:1,r:"RARE",d:"아군 기물이 모두 같은 색 칸에 있다면, 상대 기물은 반대 색 칸에 도착할 수 없습니다."},
 lastres:{n:"마지막 저항",r:"RARE",d:"사용: 아군 킹이 3턴 동안 보호를 얻습니다."},
 hunger:{n:"빈 찬합",r:"RARE",d:"사용: 무작위 상대 기물(킹 제외) 하나가 다음 3수 안에 자기 킹과 인접하지 못하면 자결합니다."},
 othello:{n:"오델로",r:"RARE",d:"사용: 이번 턴 종료 시 연속한 아군 기물 2개 사이에 끼인 상대 기물(가로·세로·대각선)을 모두 전향시킵니다."},
 frenzy:{n:"광란",r:"EPIC",d:"사용: 무작위 아군 폰 하나가 이번 턴에 기물을 잡을 때마다 한 번 더 이동할 수 있습니다."},
 extinct:{n:"멸종",r:"EPIC",d:"사용: 무작위 아군 마이너 피스 하나와 동일한 종류의 모든 기물을 진영을 가리지 않고 삭제합니다."},
 traitor:{n:"변절자",r:"EPIC",d:"사용: 한 번 이상 움직인 상대 기물(킹 제외) 중 가장 약한 기물 하나를 내 편으로 전향시킵니다."},
 pent:{n:"오목",p:1,r:"EPIC",d:"이 카드를 획득한 상태에서 아군 기물이 세로로 5개 세워지는 순간 게임에서 승리합니다."},
 hypocrisy:{n:"위선",r:"EPIC",d:"사용: 무작위 빈 위치 4곳에 적 폰을 소환합니다."},
 dream:{n:"일장춘몽",r:"EPIC",d:"사용: 상대방의 모든 프로모션 기물을 폰으로 되돌립니다."},
 conscript:{n:"징집",r:"EPIC",d:"사용: 아군 두 번째 랭크의 빈 중앙 4개 파일(c~f)에 폰을 즉시 소환합니다."},
 hope:{n:"희망",p:1,r:"EPIC",d:"내 턴 시작 시 보드 위에 남은 아군 기물이 킹을 포함해 2개 이하라면 승리합니다."},
 leap:{n:"도약",p:1,r:"EPIC",d:"아군 폰이 앞의 기물을 뛰어넘어 전진할 수 있습니다. 해당 이동으로는 기물을 잡지 못합니다."},
 vanish:{n:"소멸",r:"LEGEND",d:"사용: 이후 매 수가 끝날 때마다 아군과 상대 기물(킹 제외)이 무작위로 하나씩 사라집니다."},
 joker:{n:"조커",r:"LEGEND",d:"사용: 이미 사용한 액티브 카드 하나(무작위)를 다시 사용할 수 있게 되돌립니다."},
 armistice:{n:"종전",r:"LEGEND",d:"사용: 다음 3수 동안(양쪽 합쳐 6수) 체크 또는 기물 포획이 한 번도 발생하지 않으면 즉시 승리합니다."},
 ultimatum:{n:"최후통첩",r:"LEGEND",d:"사용: 4수 뒤, 킹을 제외하고 마지막 4수 동안 한 번도 움직이지 않은 모든 기물이 제거됩니다."},
 jeans:{n:"청바지",p:1,r:"LEGEND",d:"획득 시 모든 아군과 적군의 메이저 피스(퀸·룩)를 게임에서 추방합니다."},
 cancel:{n:"캔슬링",r:"LEGEND",d:"사용: 상대가 캐슬링했다면, 상대 킹을 시작 위치로 돌려보냅니다(시작 칸이 비어 있어야 해요)."},
 highlander:{n:"하이랜더",p:1,r:"LEGEND",d:"킹을 포함해 아군 기물이 4종류 이상이며, 같은 종류의 기물이 하나도 없다면 즉시 승리합니다."},
 penta:{n:"펜타 체크",o:1,p:1,r:"LEGEND",d:"내 턴 시작 시, 상대 킹을 총 다섯 번 이상 체크했다면 승리합니다."},
 swap:{n:"강제 교환",r:"COMMON",d:"사용: 무작위 내 기물(킹 제외) 하나를 희생하면, 같은 종류의 무작위 상대 기물 하나가 즉시 사라져요. (고르기 대신 무작위)"},
 icbm:{n:"ICBM",r:"COMMON",d:"사용: 내 퀸과 상대 퀸이 있어야 해요. 상대의 다음 차례가 끝나면 상대 퀸 주변 3×3 칸이 폭발해요(킹도 사라져요)."},

  <div class="lb">관리자 ${admU.length}명</div>${admU.map(uid=>`<div class="li"><span>${nm(uid)}</span>${owner()?`<button class="g" data-ad="${esc(uid)}">관리자 해제</button>`:""}</div>`).join("")||'<div class="empty">추가한 관리자가 없어요</div>'}
  ${owner()?`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input id="admA" placeholder="닉네임으로 관리자 추가" aria-label="관리자로 추가할 닉네임" maxlength="12" style="flex:1 1 200px;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)"><button id="admAb">추가</button></div><small>사용자 탭의 '관리자 지정' 버튼으로도 추가할 수 있어요. 관리자는 다른 관리자와 최고 관리자의 계정은 바꿀 수 없어요.</small>`:"<small>관리자 추가·해제는 최고 관리자만 할 수 있어요.</small>"}</div>`;
  B.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>admToggle(b.dataset.ad));
  if($("admAb")){const go=()=>{const q=$("admA").value.trim().toLowerCase(),u=adU.find(x=>x.nameLower===q);if(!q)return;if(!u)return toast("그런 닉네임이 없어요");
    if(u.uid===me.uid)return toast("최고 관리자는 이미 모든 권한이 있어요");if(admU.includes(u.uid))return toast("이미 관리자예요");admToggle(u.uid)};
   $("admAb").onclick=go;$("admA").onkeydown=e=>{if(e.key==="Enter")go()}}}
 function augUI(B){if(!adC)adC={w:{...AUGW},off:new Set(AUG_OFF)};const ids=Object.keys(AUGS),cnt=t=>ids.filter(k=>AUGS[k].r===t&&!AUGS[k].o&&!adC.off.has(k)).length;
  B.innerHTML=`<div class="adr"><div class="panel"><div class="ph"><span>등급 가중치</span></div><div style="padding:8px 0">${TIERS.map(t=>`<div class="awt"><span class="ag2 rk-${t}"><i class="rkt">${RA[t]}</i>${t}</span><input type="range" min="0" max="5" step="0.01" value="${adC.w[t]}" data-w="${t}" aria-label="${t} 가중치"><input type="number" min="0" max="5" step="0.01" value="${adC.w[t]}" data-n="${t}" aria-label="${t} 가중치 값"></div>`).join("")}<div style="padding:6px 16px 10px"><small>가중치 × 그 등급에서 켜진 증강 수로 등급을 먼저 뽑아요</small></div></div></div>
  <div class="panel"><div class="ph"><span>중간 증강 선택 때 등급이 나올 확률</span></div><div id="admP" style="padding:14px 16px"></div></div></div>
  <div class="panel"><div class="ph"><span>증강 목록 · 끄면 뽑기에서 빠져요</span><span id="admC"></span></div><div class="agl">${ids.map(k=>{const a=AUGS[k],r=RA[a.r]?a.r:"COMMON";return`<label${adC.off.has(k)?' class="off"':""} title="${esc(a.d)}"><input type="checkbox" data-k="${k}"${adC.off.has(k)?"":" checked"}><i class="ag2 rk-${r}"><i class="rkt">${RA[r]}</i></i><span>${esc(a.n)}</span><small style="margin-left:auto">${a.o?"OPENING":a.p?"PASSIVE":"ACTIVE"}</small></label>`}).join("")}</div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap"><small style="margin-right:auto">저장하면 새로 시작하는 판부터 모든 사람에게 적용돼요</small><button class="g" id="admDf"${owner()?"":" hidden"}>기본값으로</button><button id="admSv"${owner()?"":" hidden"}>저장</button></div>`;
  const pv=()=>{const ws=TIERS.map(t=>adC.w[t]*cnt(t)),tot=ws.reduce((a,b)=>a+b,0)||1;
   $("admP").innerHTML=`<div style="display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--card2)">${TIERS.map((t,i)=>`<span style="flex:${ws[i]} 0 0;background:${CL[t]}"></span>`).join("")}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:14px">${TIERS.map((t,i)=>`<span>${t} <b style="font-family:var(--f-mono);font-weight:500">${(ws[i]/tot*100).toFixed(1)}%</b> <small>(${cnt(t)}장)</small></span>`).join("")}</div>`;
   $("admC").textContent=`${ids.length-adC.off.size}/${ids.length}개 켜짐`};
  B.querySelectorAll("[data-w],[data-n]").forEach(e=>e.oninput=()=>{const t=e.dataset.w||e.dataset.n,v=Math.max(0,Math.min(5,+e.value||0));adC.w[t]=v;B.querySelector(`[data-${e.dataset.w?"n":"w"}="${t}"]`).value=v;pv()});
  B.querySelectorAll("[data-k]").forEach(e=>e.onchange=()=>{adC.off[e.checked?"delete":"add"](e.dataset.k);e.parentNode.classList.toggle("off",!e.checked);pv()});
  $("admDf").onclick=()=>{adC={w:{...AUGW0},off:new Set()};augUI(B)};
  $("admSv").onclick=async()=>{if(!owner())return toast(RO_MSG);const on=ids.filter(k=>!adC.off.has(k)),op=on.filter(k=>AUGS[k].o).length;
   if(op<3||on.length-op<3)return toast("시작용·중간용 증강을 각각 3개 이상 켜 두어야 해요");
   if(!TIERS.some(t=>adC.w[t]>0&&cnt(t)))return toast("가중치가 0보다 큰 등급이 하나는 있어야 해요");
   const w={};TIERS.forEach(t=>w[t]=adC.w[t]);
   try{await db.doc("config/augment").set({w,off:[...adC.off],by:me.uid,at:FV.serverTimestamp()});applyAug({w,off:[...adC.off]});toast("증강 설정을 저장했어요")}catch(e){toast(errMsg(e))}};
  if(!owner())B.querySelectorAll("input").forEach(e=>e.disabled=true);
  pv()}
 function ntcUI(B){B.innerHTML=`<div class="panel" style="padding:16px"><div class="lb" style="margin-top:0">로비 공지</div><textarea id="admN" maxlength="300" aria-label="로비 공지" placeholder="로비 맨 위에 보일 문구예요. 비우고 올리면 공지가 사라져요">${esc(ntcT)}</textarea><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button id="admNs"${owner()?"":" hidden"}>공지 올리기</button><button class="g" id="admNd"${owner()?"":" hidden"}>공지 내리기</button></div></div>`;
  if(!owner())$("admN").readOnly=true;
  const put=t=>!owner()?toast(RO_MSG):db.doc("config/notice").set({text:t,by:me.uid,at:FV.serverTimestamp()}).then(()=>toast(t?"공지를 올렸어요":"공지를 내렸어요")).catch(e=>toast(errMsg(e)));

 return{init,push,record,resign,leave,quit,dots,dot,invite,admOpen,admLoad,me:()=>me&&prof?me:null,friends:()=>friends};
