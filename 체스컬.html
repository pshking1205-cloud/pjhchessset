<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체스 컬렉션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@800&family=Cinzel:wght@600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 고정 내비 + 로비(플레이 설정) / 대국 화면(보드·플레이어 바 | 기보·정보 사이드 패널). 체스 사이트식 다크 우선 */
:root{
 --bg:#2b2926;--nav:#211f1c;--card:#363330;--card2:#45413c;--fg:#f0ece6;--mut:#a59f96;--bd:#4b4641;
 --ac:#81b64c;--acd:#5b8a2c;--acf:#ffffff;--gold:#e8b13a;--warn:#e5574a;
 --lt:#ebecd0;--dk:#739552;--hl:rgba(255,255,51,.45);
 --f-disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
 --f-body:"IBM Plex Sans KR","Noto Sans KR",system-ui,-apple-system,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --navh:54px;color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efede8;--nav:#ffffff;--card:#ffffff;--card2:#f0eee8;--fg:#262421;--mut:#6c675f;--bd:#dcd8cf;--ac:#6fa23c;--acd:#4e7a24;--gold:#c48a10;--warn:#c9392c;color-scheme:light}}
:root[data-theme="light"]{--bg:#efede8;--nav:#ffffff;--card:#ffffff;--card2:#f0eee8;--fg:#262421;--mut:#6c675f;--bd:#dcd8cf;--ac:#6fa23c;--acd:#4e7a24;--gold:#c48a10;--warn:#c9392c;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:46;background:var(--nav)}
button{font:inherit;font-weight:700;padding:9px 14px;border-radius:8px;border:0;background:var(--ac);color:var(--acf);cursor:pointer;box-shadow:0 3px 0 var(--acd);transition:filter .12s,transform .06s}
button:hover:not(:disabled){filter:brightness(1.08)}button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--acd)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.g{background:var(--card2);color:var(--fg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:disabled{opacity:.35;cursor:default}
small{color:var(--mut)}

/* 내비 */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:45;height:var(--navh);background:var(--nav);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;background:none;box-shadow:none;color:var(--fg);padding:4px 6px 4px 0;font-family:var(--f-disp);font-size:20px;font-weight:400;letter-spacing:.5px}
.logo .pc{width:28px;height:28px}
.logo:active:not(:disabled){transform:none;box-shadow:none}
.nlink{background:none;box-shadow:none;color:var(--mut);padding:8px 10px;font-weight:500}
.nlink:hover{color:var(--fg)}.nlink:active:not(:disabled){box-shadow:none}
.sp{flex:1}
#acb{display:flex;gap:6px;align-items:center;min-width:0}
#acb button{padding:7px 11px;font-size:13px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;box-shadow:none}
#gear{width:36px;height:36px;padding:0;font-size:18px;background:var(--card2);color:var(--fg);box-shadow:none;flex:0 0 auto}
.bdn{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--warn);color:#fff;font-size:11px}
@media(max-width:560px){.nlink{display:none}}@media(max-width:420px){.logo span{display:none}}

/* 대국 화면 */
.app{max-width:1180px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.app{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.stage{width:min(100%,max(300px,calc(100dvh - var(--navh) - 150px)));margin:0 auto;display:flex;flex-direction:column;gap:8px}
.pbar{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 2px}
.av{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;background:var(--card2)}
.av.w{background:#d8d4cc}.av.b{background:#2f2c29}.av .pc{width:30px;height:30px}
.pn{min-width:0;flex:1}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{font-weight:400;margin-left:6px}
.cap{display:flex;align-items:center;min-height:18px;flex-wrap:wrap}
.cap .pc{width:17px;height:17px;margin-right:-5px}
.cap b{margin-left:9px;font-size:12px;color:var(--mut);font-weight:500}
.lv{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--gold);color:#2b2926;font-size:11px;font-weight:700;vertical-align:1px}
.turn{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ac);color:var(--acf)}
.pbar.act .av{box-shadow:0 0 0 2px var(--ac)}

#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;max-width:100%;aspect-ratio:1/1;border-radius:4px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);container-type:inline-size}
.q{display:flex;align-items:center;justify-content:center;font-size:9cqw;line-height:1;position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-width:0;min-height:0;overflow:hidden}
.l{background:var(--lt)}.d{background:var(--dk)}
.lm{background-image:linear-gradient(var(--hl),var(--hl))}
.s{background-image:linear-gradient(rgba(255,255,51,.6),rgba(255,255,51,.6))}
.ck{background-image:radial-gradient(circle,rgba(229,57,53,.95),rgba(229,57,53,0) 75%);animation:ckpulse 1s infinite}
.atk{box-shadow:inset 0 0 0 3px rgba(229,57,53,.85)}
@keyframes ckpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.m2::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.16);position:absolute}
.m2.x::after{width:92%;height:92%;background:none;border:6cqw solid transparent;border-width:.9cqw;box-shadow:inset 0 0 0 1cqw rgba(0,0,0,.18);border-radius:50%}
.q:hover.m2::after{background:rgba(0,0,0,.26)}
.bdg{position:absolute;left:2px;bottom:1px;font-size:11px;line-height:1;font-style:normal;pointer-events:none}.fzn{box-shadow:inset 0 0 0 3px rgba(80,170,255,.85)}
.co{position:absolute;font-size:max(9px,1.6cqw);line-height:1;font-weight:700;font-style:normal;font-family:var(--f-body)}.cf{right:3px;bottom:2px}.cr{left:3px;top:3px}
.l .co{color:var(--dk)}.d .co{color:var(--lt)}
.o2{display:inline-block;transform:rotate(180deg)}
.pc{display:block;width:1.25em;height:1.25em}.pw .pc{filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}.pb .pc{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border-radius:10px;overflow:hidden;min-width:0}
.ph{padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--mut);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between}
#top{padding:14px}
#st{font-weight:700;font-size:15px;line-height:1.4}
#st #ms{font-weight:400;font-size:13px;color:var(--mut);margin-top:4px;min-height:17px}
#tmr,#tmr2{font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
#hs{max-height:250px;overflow:auto;font-family:var(--f-mono);font-size:13px}
.mr{display:grid;grid-template-columns:44px 1fr 1fr;padding:5px 14px}.mr:nth-child(odd){background:rgba(127,127,127,.07)}
.mr i{font-style:normal;color:var(--mut)}.mr span{justify-self:start;padding:0 6px;border-radius:3px;min-width:0;overflow-wrap:anywhere}.mr span.cur{background:var(--card2);font-weight:700}
#hs>div:not(.mr){padding:4px 14px}
.empty{padding:14px;color:var(--mut);font-family:var(--f-body)}
#inf{padding:12px 14px;font-size:13px;line-height:1.6}
.ag2{cursor:pointer;display:inline-block;padding:2px 8px;margin:2px;border:1px solid var(--bd);border-radius:999px;background:var(--card2)}.ag2.u{opacity:.5}
/* 증강 칩 등급 색: COMMON 회색 · RARE 파랑 · EPIC 자주 · LEGEND 금 · LUNACY 장미 */
.ag2 .rkt{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;padding:0 5px;margin-right:4px;border-radius:999px;color:#fff;vertical-align:1px}
.ag2.rk-COMMON{border-color:#8a8f99}.ag2.rk-COMMON .rkt{background:#7d828c}
.ag2.rk-RARE{border-color:#3b8ee6;background:color-mix(in srgb,#3b8ee6 16%,var(--card2))}.ag2.rk-RARE .rkt{background:#2f7fd8}
.ag2.rk-EPIC{border-color:#a24fd6;background:color-mix(in srgb,#a24fd6 16%,var(--card2))}.ag2.rk-EPIC .rkt{background:#9440c8}
.ag2.rk-LEGEND{border-color:#d9a520;background:color-mix(in srgb,#e8b13a 20%,var(--card2))}.ag2.rk-LEGEND .rkt{background:linear-gradient(90deg,#c88a0c,#f0c544);color:#3a2400}
.ag2.rk-LUNACY{border-color:#e0457f;background:color-mix(in srgb,#e0457f 18%,var(--card2));box-shadow:0 0 8px rgba(255,90,140,.45)}.ag2.rk-LUNACY .rkt{background:linear-gradient(90deg,#9c0c3e,#f2558f);font-family:Cinzel,Georgia,serif}
.ag2.rkl{cursor:default;font-size:10px;padding:0 6px 0 2px;letter-spacing:.5px}
/* ACTIVE·PASSIVE도 등급 글자(영문 대문자)와 같은 모양으로 */
.dct,.aty{text-transform:uppercase}
/* 좁은 화면: 「등급 · PASSIVE · OPENING」이 길면 줄바꿈해서 카드가 화면 밖으로 밀리지 않게 */
#drb .dc{min-width:0}
@media(max-width:600px){#drb .dct,#cv .dct{white-space:normal!important;line-height:1.35;max-width:100%;text-align:center;border-radius:8px}}.aty{font-weight:700;letter-spacing:.8px;font-size:11px}
.adc{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--card2)}
#inf button{margin:6px 4px 0 0;padding:6px 10px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.toolbar button{margin:0;padding:10px 6px;font-size:13px;flex:1 1 28%}
#top2{transform:rotate(180deg);background:var(--card);border-radius:10px;padding:10px 12px}
#top2 button{margin:6px 4px 0 0}

/* 오버레이 공통 */
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:20px}
.ov.on{display:flex}
.pop{background:var(--card);color:var(--fg);border-radius:14px;padding:20px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.pop h2,.pop h3{margin:2px 0 14px;font-family:var(--f-disp);font-weight:400;letter-spacing:.3px}
.pop h2{font-size:26px}.pop h3{font-size:20px}
#pm{display:flex;justify-content:center;gap:8px;margin-top:12px}
#pm button{padding:8px;background:var(--card2);box-shadow:none}#pm .pc{width:44px;height:44px}
/* 증강 선택: 금속 테두리 카드 3장 (등급 색: COMMON 회색 · RARE 파랑 · EPIC 자주 · LEGEND 노랑) */
#dro{background:radial-gradient(ellipse at 50% 40%,rgba(40,34,60,.82),rgba(6,6,12,.92));backdrop-filter:blur(3px);overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#dro .pop{max-width:780px;background:none;box-shadow:none;padding:0;margin:auto}
.dcd{overflow-wrap:anywhere}
#drt{color:#f3effa;font-size:18px;margin-bottom:18px!important;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#drb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.dc{--c1:#e4e6ec;--c2:#80858f;--c3:#b9bdc6;--gl:rgba(205,210,222,.32);display:flex;margin:0;padding:5px;border-radius:16px;color:#f3effa;font-weight:500;text-align:center;
 background:linear-gradient(155deg,var(--c1),var(--c2) 38%,var(--c3) 55%,var(--c2) 75%,var(--c1));
 box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 0 22px var(--gl),0 14px 30px rgba(0,0,0,.5);
 animation:dcin .45s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i)*90ms);transition:transform .15s,box-shadow .15s}
.dc:hover:not(:disabled){filter:none;transform:translateY(-6px);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 34px var(--gl),0 20px 36px rgba(0,0,0,.55)}
.dc:active:not(:disabled){transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 34px var(--gl)}
.dc.rc-RARE{--c1:#bfe3ff;--c2:#2b72c9;--c3:#64aef5;--gl:rgba(70,150,255,.5)}
.dc.rc-EPIC{--c1:#efc2ff;--c2:#8530bd;--c3:#c272ee;--gl:rgba(190,80,255,.55)}
.dc.rc-LEGEND{--c1:#fff3b0;--c2:#b8860f;--c3:#f3cb4a;--gl:rgba(255,196,50,.6)}
.dcf{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:290px;padding:22px 14px 18px;border-radius:12px;
 background:radial-gradient(ellipse at 50% 0,var(--gl),transparent 55%),linear-gradient(180deg,#262331,#131219);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.dci{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px;
 background:radial-gradient(circle at 50% 35%,#3b3650,#17151f 70%);box-shadow:0 0 0 2px var(--c3),0 0 0 6px rgba(0,0,0,.45),0 0 26px var(--gl)}
.dci svg{width:40px;height:40px;fill:var(--c1);filter:drop-shadow(0 0 6px var(--gl))}
.dcn{font-size:17px;font-weight:700;line-height:1.3;color:#fff;text-wrap:balance}
.dct{font-size:11px;font-weight:700;letter-spacing:.8px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.4);color:var(--c1);box-shadow:inset 0 0 0 1px var(--c2)}
.dcd{font-size:13px;line-height:1.55;color:#cdc8da;margin-top:4px}
@keyframes dcin{from{opacity:0;transform:translateY(24px) scale(.94)}}
@media(max-width:600px){#drb{gap:8px}.dc{padding:3px;border-radius:12px}#drt{font-size:16px;margin-bottom:12px!important}.dcf{min-height:200px;padding:12px 6px 10px;gap:5px;border-radius:10px}.dci{width:44px;height:44px;margin-bottom:2px}.dci svg{width:24px;height:24px}.dcn{font-size:14px}.dct{font-size:9px;padding:2px 6px;letter-spacing:0;white-space:nowrap}.dcd{font-size:11.5px;line-height:1.45}}
#rso .pop{padding:0;overflow:hidden}
#rso .rh{background:var(--ac);color:var(--acf);padding:22px 20px 16px}
#rso .rh h2{margin:0;color:inherit}
#rw{padding:14px 20px 4px;color:var(--mut)}
#rso .rb{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 20px 20px}
#rso .rb button{margin:0}#rso #rn{grid-column:1/-1}
#cv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:35}#cv.show{opacity:1}
.cc{width:150px;height:210px;border-radius:16px;border:6px solid #fff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);text-align:center;padding:8px;animation:pop .35s}
.cc b{font-size:62px;line-height:1}.cc span{font-size:15px;font-weight:700}@keyframes pop{from{transform:scale(.5) rotate(-12deg)}}
.pop input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:100%;margin:4px 0}
.pop.wd{max-width:460px;text-align:left;max-height:88vh;overflow:auto}
.pop.wd button{margin:4px 4px 0 0}
.er{color:var(--warn);font-size:12px;min-height:16px;margin-top:4px}.xb{float:right;margin:-6px -6px 0 6px!important;padding:5px 10px}
.lb{margin:16px 0 8px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--mut)}
.li{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--bd)}.li>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li button{margin:0!important;padding:5px 9px;font-size:12px;box-shadow:none}
.tb{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.tb th,.tb td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:center}.tb td:first-child,.tb th:first-child{text-align:left}.tb th{color:var(--mut);font-weight:500}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px}
.tabs button{flex:1;margin:0;box-shadow:none;background:transparent;color:var(--mut);padding:9px 6px}
.tabs button.on{background:var(--ac);color:var(--acf)}
.md{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5}
#acc{z-index:52}#lgo,#wto{z-index:53}#ivo{z-index:55}#stg{z-index:54}#ask{z-index:70}
#stg .pop{max-width:320px}
#stg button{display:block;width:100%}
#volSl{width:100%;accent-color:var(--ac)}
#tst{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}#tst.show{opacity:1}
#ask .rb{display:flex;gap:8px;margin-top:16px}#ask .rb button{flex:1}

/* 로비 */
#mn{z-index:40;top:calc(var(--navh) + env(safe-area-inset-top,0px));background:var(--bg);overflow:auto;padding:0}
#mn.on{display:block}
.lobby{max-width:1080px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:900px){.lobby{grid-template-columns:minmax(0,1fr) 400px;padding-top:44px}}
.hero{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p{margin:0;color:var(--mut);font-size:15px;line-height:1.6;max-width:44ch}
#pv{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(100%,460px);aspect-ratio:1/1;border-radius:6px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.4);container-type:inline-size}
#pv>div{display:grid;place-items:center;font-size:9cqw;min-width:0;min-height:0;overflow:hidden}
@media(max-width:899px){#pv{display:none}.hero h1{font-size:34px}.hero{display:contents}}
.play{background:var(--card);border-radius:14px;padding:20px;min-width:0}
.play h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px}
.opts{display:grid;gap:8px}

#lurv .lusm{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 66%);opacity:0;will-change:transform,opacity;animation:lusmoke var(--t) cubic-bezier(.15,.7,.3,1) both;animation-delay:calc(1.15s + var(--d))}
@keyframes lusmoke{0%{opacity:0;transform:translate(0,0) scale(.2)}14%{opacity:.95}55%{opacity:.7}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(var(--g)) rotate(50deg)}}

#lurv .lug{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);background:var(--c);opacity:0;will-change:transform,opacity;animation:luglit var(--t) cubic-bezier(.15,.7,.3,1) both,lutwk .32s steps(2) infinite;animation-delay:calc(1.2s + var(--d)),calc(1.2s + var(--d))}

/* 천사 기물: 금빛 후광 */
.ang .pc{filter:drop-shadow(0 0 2px #ffe08a) drop-shadow(0 0 5px rgba(255,215,120,.85))!important}
/* 부활한 칸: 천사 링이 바닥에서 기물 머리 위까지 올라갔다 사라짐 */
.rvq>span{animation:rvpop 1.4s ease-out both;position:relative;z-index:3}
@keyframes rvpop{0%{opacity:0;transform:translateY(8%)}55%{opacity:1}100%{opacity:1;transform:none}}
.rvq{overflow:visible!important;z-index:5}
.rvq .halo{position:absolute;left:14%;width:72%;top:40%;height:22%;border-radius:50%;pointer-events:none;border:max(3px,1.1cqw) solid transparent;animation:halo 1.9s cubic-bezier(.35,.1,.3,1) both}

/* 증강을 고르면: 고른 카드가 등급 색 연기와 글리터 속으로 사라짐 */
.dc.picked{animation:pkout .7s ease-in forwards!important;pointer-events:none}
.dc.faded{transition:opacity .35s;opacity:0!important;pointer-events:none}
@keyframes pkout{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(.82) translateY(-6%);opacity:0}}
.pkfx{position:fixed;inset:0;pointer-events:none;z-index:32}
.pkfx .ps{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 66%);opacity:0;will-change:transform,opacity;animation:pkpuff var(--t) cubic-bezier(.15,.7,.3,1) both;animation-delay:var(--d)}

/* 능동 증강 사용: 카드가 떠올랐다가 등급 색 빛이 나는 동시에 빠르게 사라짐 */
#cv.ua{transition:none}
#cv .uaw{width:min(230px,58vw)}
#cv .uac{width:100%;pointer-events:none;animation:uain .45s cubic-bezier(.2,.9,.3,1.25) both,uaout .7s ease-out 1.35s forwards!important}
#cv .uac .dcf{min-height:0}
#cv .uac::after{content:"";position:absolute;inset:-6px;border-radius:20px;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,var(--c1),var(--gl) 45%,transparent 72%);opacity:0;mix-blend-mode:screen;animation:uaglow .7s ease-out 1.35s forwards}
.dc.uac{position:relative}
@keyframes uain{from{opacity:0;transform:translateY(30px) scale(.7)}}
@keyframes uaout{0%{opacity:1;transform:scale(1);filter:brightness(1.3);box-shadow:0 0 40px var(--gl),0 0 100px var(--gl),0 0 160px var(--gl)}100%{opacity:0;transform:scale(1.1);filter:brightness(2.4);box-shadow:0 0 60px var(--gl),0 0 140px var(--gl),0 0 220px var(--gl)}}
@keyframes uaglow{0%{opacity:.95}100%{opacity:0;transform:scale(1.5)}}
/* 루나시 능동 증강: 등장 때 장미빛 고리와 꽃잎이 터지고, 사라질 때 장미빛 연기·꽃잎·글리터가 화면으로 퍼짐 */
#cv.lu .uac{animation:uain .5s cubic-bezier(.2,.9,.3,1.25) both,luuaout .8s ease-out 1.3s forwards!important}
@keyframes luuaout{0%{opacity:1;transform:scale(1);filter:brightness(1.4);box-shadow:0 0 50px rgba(255,90,140,.9),0 0 120px rgba(220,30,80,.7),0 0 200px rgba(255,150,190,.5)}100%{opacity:0;transform:scale(1.16) rotate(-2deg);filter:brightness(2.6);box-shadow:0 0 80px rgba(255,90,140,.9),0 0 180px rgba(220,30,80,.7),0 0 300px rgba(255,150,190,.5)}}
#cv .luua{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#cv .luring{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;border:3px solid #ffd0e2;box-shadow:0 0 20px #ff6fa3,inset 0 0 20px #ff6fa3;opacity:0;animation:luring .9s ease-out both}
@keyframes luring{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
#cv .lup{position:absolute;left:50%;top:50%;width:var(--s);height:calc(var(--s)*1.25);margin:calc(var(--s)*-.62) 0 0 calc(var(--s)*-.5);border-radius:70% 0 70% 0;background:linear-gradient(135deg,#ffd3e4,#f2558f 55%,#9c0c3e);box-shadow:inset 0 0 0 1px rgba(255,240,246,.8);opacity:0;animation:lupet var(--t) cubic-bezier(.2,.7,.3,1) var(--dl) both}
@keyframes lupet{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d)*-1)) rotate(var(--r)) scale(1)}}
#cv .lus2{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 66%);opacity:0;animation:lusm2 var(--t) cubic-bezier(.15,.7,.3,1) 1.3s both}

/* 섬광(카드 뒤에서 뻗어 나옴): 가운데 둥근 빛 없이 굵은 빛줄기 두 겹 (등급 색으로 살짝 물듦) */
#cv .uaw{position:relative;isolation:isolate}
#cv .uac{z-index:1}
#cv .uac::after{display:none}
#cv .uab{position:absolute;left:50%;top:50%;width:var(--z);height:var(--z);margin:calc(var(--z)/-2) 0 0 calc(var(--z)/-2);pointer-events:none;z-index:0;opacity:0;mix-blend-mode:screen;animation:uaburst .75s cubic-bezier(.2,.8,.3,1) 1.3s both}
#cv .uab i{position:absolute;inset:0;border-radius:50%}
#cv .uab .rl{-webkit-mask:radial-gradient(circle,transparent 0,transparent 3%,#000 9%,rgba(0,0,0,.75) 40%,transparent 80%);mask:radial-gradient(circle,transparent 0,transparent 3%,#000 9%,rgba(0,0,0,.75) 40%,transparent 80%);animation:uaspin .75s linear 1.3s both}
#cv .uab .rs{-webkit-mask:radial-gradient(circle,transparent 0,transparent 3%,#000 8%,transparent 48%);mask:radial-gradient(circle,transparent 0,transparent 3%,#000 8%,transparent 48%);animation:uaspin2 .75s linear 1.3s both}
@keyframes uaburst{0%{opacity:0;transform:scale(.15)}18%{opacity:1;transform:scale(.85)}100%{opacity:0;transform:scale(1.25)}}
@keyframes uaspin{to{transform:rotate(14deg)}}

/* 증강 대상 표식: 칸 오른쪽 위, 어두운 원형 칩 + 등급처럼 색 테두리 + 흰 아이콘 (보드 크기에 맞춰 커짐) */
.amk{position:absolute;right:3%;top:3%;display:flex;flex-direction:row-reverse;gap:1px;pointer-events:none;z-index:4}
.amk .am{position:relative;display:grid;place-items:center;width:max(10px,2.7cqw);height:max(10px,2.7cqw);border-radius:50%;background:rgba(22,20,18,.86);box-shadow:0 0 0 1.5px var(--a),0 1px 3px rgba(0,0,0,.5);font-style:normal}
.amk .am svg{width:68%;height:68%;fill:var(--a)}
.amk .am b{position:absolute;right:-3px;bottom:-3px;min-width:max(8px,1.8cqw);height:max(8px,1.8cqw);padding:0 2px;border-radius:999px;background:var(--a);color:#1d1b19;font-size:max(7px,1.35cqw);line-height:max(8px,1.8cqw);text-align:center;font-weight:800}
.amk .am.more{width:auto;padding:0 3px;border-radius:999px;font-size:max(7px,1.4cqw);font-weight:800;color:#fff;--a:#6c675f}
.amk .am{animation:amin .35s cubic-bezier(.2,1.4,.4,1) both}
/* 한 기기 2인: 맞은편(흑)이 보는 기물은 표식을 칸 오른쪽 아래에, 아이콘·숫자도 흑 쪽에서 바로 읽히게 뒤집음 */
.amk.rot{top:auto;bottom:3%}
.amk.rot .am{transform:rotate(180deg)}
.amk.rot .am{animation:aminr .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes aminr{from{transform:rotate(180deg) scale(0)}}
@keyframes amin{from{transform:scale(0)}}
/* 한 기기 2인에서 흑이 증강을 고를 때: 창 전체를 흑 쪽으로 뒤집음 */
#dro.flip2 .pop{transform:rotate(180deg)}
